<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the theme attribute IMMEDIATELY, before the rest of the
       page loads or renders — see index.html for the full explanation
       of why this needs to be an inline script. -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <title>Race by Code - Match Lobby</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div id="app-shell">

    <aside id="sidebar">
      <div id="sidebar-brand">
        <h2>Race by Code</h2>
      </div>

      <nav id="sidebar-nav">
        <ul>
          <li><a href="student-dashboard.html" id="nav-dashboard">Dashboard</a></li>
          <li><a href="match-lobby.html" id="nav-lobby">Match Lobby</a></li>
          <li><a href="leaderboard.html" id="nav-leaderboard">Leaderboard</a></li>
        </ul>
      </nav>

      <button type="button" id="logout-button">Log Out</button>
    </aside>

    <div id="content-area">

      <header id="topbar">
        <h1 id="page-title">Match Lobby</h1>
        <div id="topbar-right">
          <div id="topbar-user">
            <span id="user-name">Loading...</span>
            <span id="user-tier"></span>
          </div>
          <button type="button" id="theme-toggle" aria-label="Toggle theme"></button>
        </div>
      </header>

      <main id="main-content">

        <section id="track-select">
          <h2>Choose a Track</h2>
          <label>
            <input type="radio" name="track" value="cpp" checked>
            C++
          </label>
          <label>
            <input type="radio" name="track" value="java">
            Java
          </label>
        </section>

        <section id="mode-select">
          <h2>Choose a Match Mode</h2>
          <label>
            <input type="radio" name="mode" value="public" checked>
            Public Match (up to 4 players)
          </label>
          <label>
            <input type="radio" name="mode" value="private">
            Private Match (join with a class match code)
          </label>
        </section>

        <!-- Only shown when "Private Match" above is selected.
             student.js toggles the hidden attribute on this section. -->
        <section id="private-join" hidden>
          <h2>Join a Private Match</h2>
          <label for="match-code-input">Match Code</label>
          <input type="text" id="match-code-input" name="match_code">
          <button type="button" id="join-private-button" class="btn-primary">Join</button>
          <p id="private-join-error" role="alert"></p>
        </section>

        <section id="public-queue">
          <h2>Waiting Room</h2>
          <p id="queue-status">Select a track and mode to begin.</p>

          <!-- student.js fills in participants as they join, via Socket.IO -->
          <ul id="queue-participants-list"></ul>

          <button type="button" id="start-match-button" class="btn-primary" disabled>Start Race</button>
        </section>

      </main>

    </div>

  </div>

  <script src="../js/theme.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/student.js"></script>
</body>
</html>
