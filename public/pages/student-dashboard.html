<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Sets the theme attribute IMMEDIATELY, before the rest of the
       page loads or renders — see index.html for the full explanation
       of why this needs to be an inline script. -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <title>Race by Code - Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Sidebar + topbar + main shell — used by every student page after
       login. This same sidebar block is copy-pasted across
       student-dashboard.html, match-lobby.html, and leaderboard.html.
       (Open decision, noted in project notes: whether to inject this
       dynamically via app.js instead of copy-pasting it everywhere.) -->
  <div id="app-shell">

    <aside id="sidebar">
      <div id="sidebar-brand">
        <h2>Race by Code</h2>
      </div>

      <nav id="sidebar-nav">
        <ul>
          <li><a href="student-dashboard.html" id="nav-dashboard">Dashboard</a></li>
          <li><a href="match-lobby.html" id="nav-lobby">Match Lobby</a></li>
          <li><a href="leaderboard.html" id="nav-leaderboard">Leaderboard</a></li>
        </ul>
      </nav>

      <button type="button" id="logout-button">Log Out</button>
    </aside>

    <div id="content-area">

      <header id="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div id="topbar-right">
          <div id="topbar-user">
            <span id="user-name">Loading...</span>
            <span id="user-tier"></span>
          </div>
          <button type="button" id="theme-toggle" aria-label="Toggle theme"></button>
        </div>
      </header>

      <main id="main-content">

        <section id="rank-summary">
          <h2>Your Rank</h2>
          <p id="current-tier">Bronze</p>
          <p id="total-score">Score: <span id="score-value">0</span></p>
        </section>

        <section id="track-progress">
          <h2>Track Progress</h2>

          <div id="progress-cpp">
            <h3>C++</h3>
            <progress id="progress-cpp-bar" value="0" max="100"></progress>
            <p id="progress-cpp-text">0% accuracy</p>
          </div>

          <div id="progress-java">
            <h3>Java</h3>
            <progress id="progress-java-bar" value="0" max="100"></progress>
            <p id="progress-java-text">0% accuracy</p>
          </div>
        </section>

        <section id="recent-matches">
          <h2>Recent Matches</h2>
          <table id="recent-matches-table">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Track</th>
                <th scope="col">Mode</th>
                <th scope="col">Result</th>
                <th scope="col">Score</th>
              </tr>
            </thead>
            <!-- student.js fills in rows here after fetching match history -->
            <tbody id="recent-matches-body"></tbody>
          </table>
          <p id="recent-matches-empty" hidden>You haven't played a match yet.</p>
        </section>

        <section id="achievements">
          <h2>Achievements</h2>
          <!-- student.js fills in earned achievement badges here -->
          <ul id="achievements-list"></ul>
          <p id="achievements-empty" hidden>No achievements earned yet.</p>
        </section>

      </main>

    </div>

  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/student.js"></script>
</body>
</html>
